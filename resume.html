<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Resume | Abhishek Dixit</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <div class="nav-container">

            <div class="logo">
                AD
            </div>

            <nav class="nav-links" id="navLinks">

                <a href="index.html" class="nav-item">Home</a>

                <a href="projects.html" class="nav-item">
                    Projects
                </a>

                <a href="gallery.html" class="nav-item">
                    Gallery
                </a>

                <a href="skills.html" class="nav-item">
                    Skills

                <a href="certificates.html" class="nav-item">
                    Certificates

                <a href="blog.html" class="nav-item">
                    Blog
                </a>

                <a href="resume.html" class="nav-item">
                    Resume
                </a>

                <a href="about.html" class="nav-item">
                    About
                </a>

                <a href="contact.html" class="nav-item">
                    Contact
                </a>

            </nav>


            <!-- Mobile Menu -->

            <div class="hamburger" onclick="toggleMenu()">
                ☰
            </div>

        </div>

    </header>


    <!-- ================= RESUME ================= -->

    <main>

        <section class="resume">

            <h1>Resume</h1>

            <p>
                Preview and download my updated resume below.
            </p>


            <!-- PDF PREVIEW -->

            <div class="resume-preview">

           <div>
                   <img src="./images/ResumeImg.png" alt ="Abhishek Dixit Resume">
            </div>

            </div>


            <!-- DOWNLOAD BUTTON -->

            <a
                href="./images/Resume.pdf"
                download="Abhishek_Dixit_Resume.pdf"
                class="download-resume">

                Download Full Resume

            </a>

        </section>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer>
        © 2025 Abhishek Dixit
    </footer>


    <!-- ================= JAVASCRIPT ================= -->

    <script>

        // Mobile menu

        function toggleMenu() {

            document
                .getElementById("navLinks")
                .classList
                .toggle("active");

        }


        // Active navigation item

        document
            .querySelectorAll(".nav-item")
            .forEach(link => {

                const currentPage =
                    window.location.pathname
                        .split("/")
                        .pop();

                const linkPage =
                    link.getAttribute("href");

                if (currentPage === linkPage) {

                    link.classList.add("active");

                }

            });

    </script>

</body>

</html>
